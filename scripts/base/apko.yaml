# Runtime base of the mirek/bitsql image, built by scripts/docker-publish.sh
# with apko from Wolfi packages (Chainguard's hardened, CVE-patched distro):
# glibc, CA certificates and OpenSSL only; no shell, no package manager.
# The host binary dlopens libssl.so.3 for TLS logins (moonbitlang/async/tls),
# so a plain glibc-dynamic base would silently break encrypted connections.
# Wolfi's OpenSSL also installs the 4.0 libraries; nothing here pulls them out.
# Packages are resolved fresh on every build, so each release picks up the
# latest fixes; the image carries the package SBOMs that scanners read.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - glibc
    - ld-linux
    - libssl3
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532
